services:
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=https://corporal-most-jam.ngrok-free.dev
      - N8N_HOST=corporal-most-jam.ngrok-free.dev
      - N8N_PROTOCOL=https
    volumes:
      - n8n_data:/home/node/.n8n
      - ./pagos:/files

  python-api:
    build: ./python-api
    ports:
      - "8000:8000"
    volumes:
      - ./python-api:/app
      - ./pagos:/app/pagos

volumes:
  n8n_data: